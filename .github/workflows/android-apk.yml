name: Build Malindu PDF Pro APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android project from source parts
        shell: bash
        run: |
          set -euo pipefail
          cat archive/part01.txt archive/part02.txt archive/part03.txt archive/part04.txt | base64 --decode > source.tar.xz
          echo "1e6aebb65a4563c94bc9c61727e2fec52a510436c3af9b480696cb343e11e153  source.tar.xz" | sha256sum --check
          tar --extract --xz --file source.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use GitHub runner Android SDK and install Platform 35
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unset}}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "Using Android SDK manager: $SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --list_installed | sed -n '1,40p'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Fix Android EditText single-line Kotlin compatibility
        shell: bash
        run: |
          sed -i 's/singleLine = true/setSingleLine(true)/g' app/src/main/java/com/malindu/pdfpro/MainActivity.kt app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt

      - name: Apply immersive fullscreen and floating annotation toolbar
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patches/immersive.patch
          git apply patches/immersive.patch
          sed -i 's/versionCode = 1/versionCode = 2/; s/versionName = "1.0.0"/versionName = "1.1.0"/' app/build.gradle.kts
          grep -q 'fun buildCompactToolbar' app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt

      - name: Install permanent offline PDF library and minimal auto-hide toolbar
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/library-toolbar-v2.patch.xz.b64 > /tmp/pdfpro-v2.patch.xz
          echo "801611bf5807ce4f2f6deec94f9a91fd7fec195abaebf0abdbe945470df3b6ef  /tmp/pdfpro-v2.patch.xz" | sha256sum --check
          xz -dc /tmp/pdfpro-v2.patch.xz > /tmp/pdfpro-v2.patch
          git apply --check /tmp/pdfpro-v2.patch
          git apply /tmp/pdfpro-v2.patch
          sed -i 's/versionCode = 2/versionCode = 3/; s/versionName = "1.1.0"/versionName = "1.2.0"/' app/build.gradle.kts
          grep -q 'fun importPdf' app/src/main/java/com/malindu/pdfpro/Store.kt
          grep -q 'fun scheduleAutoHide' app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt
          test -f app/src/main/java/com/malindu/pdfpro/PdfLibraryProvider.kt

      - name: Enable advanced PDFium reader, page overview and WPS-style annotation
        shell: bash
        run: |
          set -euo pipefail
          cat patches/wps-v3.part01 patches/wps-v3.part02 patches/wps-v3.part03 patches/wps-v3.part04 | base64 -d > /tmp/pdfpro-v3.patch.xz
          echo "04e6337fa55e58b6b5b979aeb401d2999954853369fd62680c6ce9d00478c5e8  /tmp/pdfpro-v3.patch.xz" | sha256sum --check
          xz -dc /tmp/pdfpro-v3.patch.xz > /tmp/pdfpro-v3.patch
          git apply --check /tmp/pdfpro-v3.patch
          git apply /tmp/pdfpro-v3.patch
          sed -i 's/versionCode = 3/versionCode = 4/; s/versionName = "1.2.0"/versionName = "1.3.0"/' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'GRADLE'
          // PDFium native tiled rendering enables continuous scrolling and crisp pinch zoom.
          dependencies {
              implementation("com.github.mhiew:android-pdf-viewer:3.2.0-beta.3")
          }
          GRADLE
          # Resolve Kotlin name collisions with PDFView's built-in resetZoom and page getter.
          sed -i 's/fun resetZoom() {/fun resetZoomSmart() {/' app/src/main/java/com/malindu/pdfpro/ProPdfView.kt
          sed -i 's/var nightMode: Boolean/var readingNightMode: Boolean/; s/\.nightMode(nightMode)/.nightMode(readingNightMode)/' app/src/main/java/com/malindu/pdfpro/ProPdfView.kt
          sed -i 's/view.nightMode/view.readingNightMode/g' app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt
          sed -i 's/view.resetZoom()/view.resetZoomSmart()/g' app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt
          sed -i 's/^                currentPage = page$/                this@ReaderActivity.currentPage = page/' app/src/main/java/com/malindu/pdfpro/ReaderActivity.kt
          grep -q 'class ProPdfView' app/src/main/java/com/malindu/pdfpro/ProPdfView.kt
          grep -q 'versionName = "1.3.0"' app/build.gradle.kts

      - name: Compile installable Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare direct APK download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Malindu_PDF_Pro.apk
          test -s Malindu_PDF_Pro.apk
          ls -lh Malindu_PDF_Pro.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Malindu-PDF-Pro-APK
          path: Malindu_PDF_Pro.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Malindu PDF Pro Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: Malindu_PDF_Pro.apk
          body: |
            Download Malindu_PDF_Pro.apk below to install on Android 8.0+.
            The APK is debug-signed. Back up annotated PDFs before uninstalling earlier builds.
